		<script type="module" src="/scripts/assemble-navbar.js"></script>
		<script type="text/javascript" src="/scripts/cables/libs.core.js"></script>
	    <script type="text/javascript" src="/scripts/cables/cables.js"></script>
	    <script type="text/javascript" src="/scripts/cables/opening-illustration/ops.js"></script>
		<script type="text/javascript" src="/scripts/cables/vargetset.js"></script>
		<script type="text/javascript" src="/scripts/cables/opening-illustration/subpatchop.js"></script>
		<script type="text/javascript" src="/scripts/cables/opening-illustration/cgl_shadermodifier.js"></script>
		<script type="text/javascript" src="/scripts/cables/opening-illustration/cgl_wireframes.js"></script>
		
		<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
		
	    <script type="text/javascript">
			// load in main animation
	        function showError(initiator,...args){CABLES.logErrorConsole("[" + initiator + "]", ...args);}
	        function patchInitialized(patch)
	        {
	            openingIllustrationPatch.setVariable("shiftPosition", 1);
	        }
			let openingIllustrationPatch = null;
	        document.addEventListener("CABLES.jsLoaded", function (event)
	        {
	            openingIllustrationPatch = new CABLES.Patch({
					patchFile: '/scripts/cables/opening-illustration/dreary_egg.json',
	                "prefixAssetPath": "",
	                "assetPath": "/media/",
	                "jsPath": "/scripts/",
	                "glCanvasId": "illustration-canvas",
	                "glCanvasResizeToParent": true,
	                "onError": showError,
	                "onPatchLoaded": patchInitialized,
	                "canvas": {"alpha":true, "premultipliedAlpha":true } // make canvas transparent
	            });
	        });
			
			// scrolling animation
			let body = document.documentElement;
			let openingIllustration = document.getElementById("opening-illustration-container");
			let openingText = document.getElementById("opening-text-container");
			let scrollPercentage = null;
			
			document.addEventListener("scroll", (event) => {
				scrollPercentage = Math.min(Math.max((body.scrollTop - window.innerHeight*0) / (window.innerHeight), 0), 1);
				openingIllustration.style.filter = `blur(${scrollPercentage * 60}px)`;
				openingIllustration.style.transform = `translateY(${Math.pow(scrollPercentage*2, 2)/2 * -200}px)`;
				openingText.style.filter = `blur(${scrollPercentage * 60}px)`;
				openingText.style.transform = `translateY(${Math.pow(scrollPercentage*2, 2)/2 * -100}px)`;
			});
			
			// twitter and youtube socials button animation
			let animatedButtons = [
				{
					"targetContainer": document.getElementById("twitter-logo-container"),
					"path": "/media/icons/twitter-logo.json",
					"playSpeed": 1
				},
				{
					"targetContainer": document.getElementById("youtube-logo-container"),
					"path": "/media/icons/youtube-logo.json",
					"playSpeed": 1.5
				}
			];
			for (button of animatedButtons) {
				let animatedButton = lottie.loadAnimation({
					container: button.targetContainer,
					renderer: 'svg',
					loop: false,
					autoplay: false,
					path: button.path
				});
				button.targetContainer.onpointerenter = (event) => {
					animatedButton.goToAndPlay(0, true);
					animatedButton.setSpeed(button.playSpeed);
				};
			}
	    </script>
	</body>
